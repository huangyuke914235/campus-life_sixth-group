# 生产覆盖配置：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 与基础配置的差异：
#   1. 数据库 / Redis / MinIO 不再映射宿主机端口（只走内部网络）
#   2. API / Web 不再暴露端口，统一由 proxy(80/443) 入口
#   3. 资源限制，避免单容器吃满内存
#   4. 启用 HTTPS 配置（需要 infra/certs 下有证书）
#
# 注意：next 的 NEXT_PUBLIC_* 是构建时内联的，运行期改 environment 无效，
# 所以这里不再覆盖 NEXT_PUBLIC_API_BASE_URL（Dockerfile 已固定为相对路径 /api/v1）。
services:
  postgres:
    restart: always
    deploy:
      resources:
        limits: { memory: 2G }
    # 生产不映射端口，仅内部网络可访问
    ports: []

  redis:
    restart: always
    ports: []

  minio:
    restart: always
    profiles: ["s3"]
    ports: []

  api:
    restart: always
    environment:
      NODE_ENV: production
      # 无证书时由部署脚本把 .env 的 COOKIE_SECURE 改成 false，这里跟随 .env
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"
      CSRF_ENABLED: "true"
      # 演示期保持开启；正式对外前在 .env 改成 false
      ENABLE_DEMO_ACCOUNTS: "${ENABLE_DEMO_ACCOUNTS:-true}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
    deploy:
      resources:
        limits: { memory: 1G }

  web:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits: { memory: 1G }

  proxy:
    restart: always
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
