# 本地开发 / 演示环境：docker compose up -d --build
# 只把反向代理暴露到宿主机；数据库、Redis、API、Web 都不对外映射端口。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiguang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiguang_dev}
      POSTGRES_DB: ${POSTGRES_DB:-shiguang}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose: ["5432"]
    # 仅绑定回环地址，方便本机 prisma migrate / 客户端连库；生产 overlay 已清空 ports
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiguang} -d ${POSTGRES_DB:-shiguang}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    expose: ["6379"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 默认不启动；需要 S3 存储时用 --profile s3 显式开启
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    profiles: ["s3"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-shiguang}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-shiguang_dev_minio}
    volumes:
      - miniodata:/data
    expose: ["9000", "9001"]
    ports: ["127.0.0.1:9001:9001"]

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shiguang}:${POSTGRES_PASSWORD:-shiguang_dev}@postgres:5432/${POSTGRES_DB:-shiguang}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # 本地默认值；prod overlay 会覆盖成 production / false
      NODE_ENV: ${NODE_ENV:-development}
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["3001"]
    # 仅本地调试 / 端到端测试使用，绑定回环地址；生产 overlay 不映射
    ports: ["127.0.0.1:3001:3001"]
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    env_file: [.env]
    environment:
    depends_on: [api]
    expose: ["3000"]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:80"]
    depends_on: [api, web]

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
