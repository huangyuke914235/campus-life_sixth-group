upstream shiguang_api { server api:3001; }
upstream shiguang_web { server web:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;   # 图片上传上限，后端另有 5MB 校验

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API 与 Swagger 文档
    location /api/ {
        proxy_pass http://shiguang_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    location /docs { proxy_pass http://shiguang_api; proxy_set_header Host $host; }

    # 菜品图片：本地存储模式下由 API 提供（生产可换 S3 + CDN）
    location /uploads/ {
        proxy_pass http://shiguang_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # 前端（SSR / 静态资源）
    location / {
        proxy_pass http://shiguang_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
