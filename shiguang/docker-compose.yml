# 内部服务定义。叠加开发、TLS 或 Tunnel 配置选择访问入口。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiguang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiguang_dev}
      POSTGRES_DB: ${POSTGRES_DB:-shiguang}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiguang} -d ${POSTGRES_DB:-shiguang}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 默认不启动；需要 S3 存储时用 --profile s3 显式开启
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    profiles: ["s3"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-shiguang}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-shiguang_dev_minio}
    volumes:
      - miniodata:/data
    expose: ["9000", "9001"]

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: ["${APP_ENV_FILE:-.env}"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-shiguang}:${POSTGRES_PASSWORD:-shiguang_dev}@postgres:5432/${POSTGRES_DB:-shiguang}?schema=public}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      NODE_ENV: ${NODE_ENV:-development}
      TZ: Asia/Shanghai
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["3001"]
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    depends_on: [api]
    expose: ["3000"]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
