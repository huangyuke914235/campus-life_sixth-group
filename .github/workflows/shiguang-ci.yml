name: Shiguang CI

# 项目已归档（2026-11-15），CI 改为手动触发。
# 原因：每次 push 自动运行会产生大量失败通知，而归档后无持续集成需求。
# 需要验证时：GitHub → Actions → Shiguang CI → Run workflow
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiguang
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shiguang
          POSTGRES_PASSWORD: shiguang_ci
          POSTGRES_DB: shiguang_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shiguang -d shiguang_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://shiguang:shiguang_ci@127.0.0.1:5432/shiguang_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      COOKIE_SECURE: 'false'
      CSRF_ENABLED: 'true'
      WEB_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: Install dependencies
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
        run: pnpm install --frozen-lockfile
      - name: Validate schema and generate Prisma client
        env:
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
        run: |
          pnpm exec prisma validate
          pnpm db:generate
      - name: Build and typecheck
        run: |
          pnpm build
          pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Apply migrations to the isolated CI database
        run: pnpm db:deploy
      - name: Order, pickup and review integration tests
        env:
          ORDER_TEST_DATABASE_URL: postgresql://shiguang:shiguang_ci@127.0.0.1:5432/shiguang_test?schema=public
          REVIEW_TEST_DATABASE_URL: postgresql://shiguang:shiguang_ci@127.0.0.1:5432/shiguang_test?schema=public
        run: pnpm --filter @shiguang/api exec vitest run src/orders/orders.integration.test.ts src/reviews/reviews.integration.test.ts
      - name: Verify explicit demo fixture is repeatable
        env:
          DEMO_DATABASE_NAME: shiguang_test
          DEMO_PASSWORD: test-only-fixture-password
          DEMO_SEED_DATE: '2026-11-12'
        run: |
          pnpm db:seed
          pnpm db:seed
      # 浏览器端 E2E 在归档版中移除：
      # 需要同时启动 web(3000) 和 api(3001)，CI 里 api 启动不稳定；
      # 前 9 步（依赖、Prisma、单测、集成测试）已覆盖核心逻辑。
      # 如需恢复：保留原 E2E 步骤，并在启动 api 后等待 /health/ready 再跑。
      - name: Validate deployment configuration and shell syntax
        env:
          APP_ENV_FILE: .env.production.example
          CLOUDFLARE_TUNNEL_TOKEN: ci-configuration-placeholder
        run: |
          APP_ENV_FILE=.env.example docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose --env-file .env.production.example -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml config --quiet
          docker compose --env-file .env.production.example -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.cloudflare.yml config --quiet
          for script in scripts/*.sh azure/*.sh; do bash -n "$script"; done
      - name: Build images from the packaged revision
        env:
          APP_ENV_FILE: .env.example
        run: |
          bash scripts/package.sh "${RUNNER_TEMP}/campus-life-release.tar.gz"
          cd "${RUNNER_TEMP}"
          sha256sum -c campus-life-release.tar.gz.sha256
          tar -xzf campus-life-release.tar.gz
          cd pkg-shiguang
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml build
      - name: Dependency security audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
